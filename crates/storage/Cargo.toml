[package]
name = "journal-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { workspace = true }
journal-entry = { path = "../entry" }
journal-store = { path = "../store" }
journal-vault = { path = "../vault" }
log = { workspace = true }
secrecy = { workspace = true }
# For the `DeserializeOwned` bound on `Storage::read`; the entry types
# themselves derive their impls in `journal-entry`.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Only the tests need a concrete store; the crate itself speaks `BlobStore`.
journal-fs-store = { path = "../fs-store" }
