[package]
name = "journal-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base32 = "0.5.1"
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
secrecy = { workspace = true }
sha2 = { version = "0.11.0", features = ["zeroize"] }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# `secrecy` and `zeroize` are also runtime dependencies; integration tests
# link only against this crate and its dev-dependencies, and the naming API
# takes both types.
hex = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
