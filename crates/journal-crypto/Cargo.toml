[package]
name = "journal-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base32 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true, features = ["zeroize"] }
secrecy = { workspace = true }
sha2 = { workspace = true, features = ["zeroize"] }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# `secrecy` and `zeroize` are also runtime dependencies; integration tests
# link only against this crate and its dev-dependencies, and the naming API
# takes both types.
hex = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
