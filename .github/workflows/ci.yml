name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustc --version
      - uses: Swatinem/rust-cache@v2

      # Cheap, needs no system libraries, and is the most likely thing to be
      # stale, so it runs before the apt install that only `src-tauri` needs.
      - name: Check src/bindings is not stale
        run: make check-bindings

      # Tauri v2 system libraries; the package list lives in scripts/setup.sh.
      # Only `src-tauri` needs them; the other crates build without them.
      - name: Install Tauri system dependencies
        run: scripts/setup.sh --system

      - run: make rust-test

  web:
    name: tsc + playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `npm run build` is `tsc` then vite; the type-check is the half that
      # catches `invoke` field-name mismatches against the committed bindings.
      - run: npm run build

      # The browser fallback fabricates entries and accepts saves that go
      # nowhere, so it must not reach a shipped build. The target rebuilds
      # rather than reusing the step above, so it also stands alone locally.
      - run: make check-no-fallback

      # Playwright starts the Vite dev server itself (playwright.config.ts),
      # so this needs no separate serve step. It exercises the browser
      # fallback in src/api/entries.ts, not the Rust backend.
      - run: npx playwright install --with-deps chromium
      - run: make test-e2e

  # Native macOS build on the free runner (the repository is public, so macOS
  # minutes cost nothing). Unsigned: it proves the app compiles and bundles
  # against the macOS toolchain and system WebKit, not that it is releasable.
  # The Dropbox key is optional at build time, so none is passed here.
  macos:
    name: tauri build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails on stale bindings, then runs `npm run tauri build`.
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: journal-macos
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  # iOS simulator build. `src-tauri/gen/apple` is not committed (only
  # `gen/schemas` is tracked), so the Xcode project is generated here. The
  # simulator target needs no signing identity, so no Apple secrets are used;
  # this proves the app cross-compiles and links for iOS, not that it can be
  # installed on a device.
  ios:
    name: tauri build (iOS simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: brew install xcodegen
      - run: make check-bindings
      - run: npm run tauri ios init -- --ci
      # `ios init` fills the generated asset catalog with Tauri's stock logo and
      # never reads `src-tauri/icons/ios`, so copy our icons over it (same file
      # names as the catalog's Contents.json).
      - name: Use the app icons in the generated project
        run: |
          catalog=src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset
          cat "$catalog/Contents.json"
          # Every file the catalog names must be one of ours.
          for name in $(grep -o '"filename" *: *"[^"]*"' "$catalog/Contents.json" | sed 's/.*: *"\(.*\)"/\1/'); do
            test -f "src-tauri/icons/ios/$name" || { echo "no icon for $name" >&2; exit 1; }
          done
          cp src-tauri/icons/ios/*.png "$catalog/"
          ls "$catalog"
      - run: npm run tauri ios build -- --ci --debug --target aarch64-sim

      # Device build without a signing identity. Xcode refuses to build for a
      # device without a development team, and `tauri ios build` cannot pass
      # `CODE_SIGNING_ALLOWED=NO`, so signing is switched off in the generated
      # project (`gen/apple/project.yml`) and the project is regenerated. The
      # result is an unsigned .ipa to be re-signed with your own certificate.
      - name: Disable code signing in the generated project
        run: |
          cat src-tauri/gen/apple/project.yml
          ruby -ryaml -e '
            f = "src-tauri/gen/apple/project.yml"
            y = YAML.load_file(f)
            y["targets"].each_value do |t|
              b = ((t["settings"] ||= {})["base"] ||= {})
              b["CODE_SIGNING_ALLOWED"] = "NO"
              b["CODE_SIGNING_REQUIRED"] = "NO"
              b["CODE_SIGN_IDENTITY"] = ""
              b.delete("DEVELOPMENT_TEAM")
            end
            File.write(f, y.to_yaml)'
          (cd src-tauri/gen/apple && xcodegen generate)
      # The archive succeeds unsigned; only tauri's final export to .ipa fails
      # ("No Team Found in Archive"), so the step is allowed to fail and the
      # .ipa is packaged from the archive below. The archive must exist.
      - name: Archive for device
        continue-on-error: true
        run: npm run tauri ios build -- --ci --target aarch64
      - name: Package unsigned .ipa
        run: |
          app=src-tauri/gen/apple/build/journal_iOS.xcarchive/Products/Applications/journal.app
          test -d "$app"
          mkdir -p out/Payload
          cp -R "$app" out/Payload/
          (cd out && zip -qr journal-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: journal-ios-unsigned
          path: out/journal-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
