[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-build = { version = "2", features = [] }
age = "=0.12.1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl"] }
uuid = { version = "1", features = ["v4", "serde"] }

# scrypt is the vault's key-file KDF, and its cost is deliberately calibrated
# in release (see `crates/vault`). Unoptimized it is ~40x slower, which turns a
# 0.4s unlock into 17s in `cargo test` and `make run`. Optimize just the KDF's
# crates in dev builds; workspace code keeps its fast debug compile.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
