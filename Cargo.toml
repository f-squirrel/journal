[workspace]
resolver = "2"
members = [
    "crates/journal-model",
    "crates/journal-crypto",
    "crates/journal-store",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/f-squirrel/journal"

[workspace.dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
secrecy = "0.10.3"
zeroize = "1.9.0"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
