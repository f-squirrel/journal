[package]
name = "desktop"
description = "Journal desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "journal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
journal-model = { path = "../../crates/journal-model", version = "0.1.0" }
journal-crypto = { path = "../../crates/journal-crypto", version = "0.1.0" }
journal-store = { path = "../../crates/journal-store", version = "0.1.0" }

[[bin]]
name = "desktop"
path = "src/main.rs"
