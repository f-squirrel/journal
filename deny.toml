[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Transitive via tauri-utils -> urlpattern -> unic-*. Unmaintained, no
    # safe upgrade exists yet; revisit when tauri drops urlpattern or it
    # migrates off the unic-* crates.
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0081", # unic-char-property
    # Transitive via tauri's Linux backend (wry/tao -> gtk-rs GTK3 bindings).
    # gtk-rs GTK3 crates are unmaintained upstream in favor of GTK4; Tauri 2
    # still targets GTK3/webkit2gtk on Linux, so this is unavoidable without
    # dropping the Linux target. Revisit when tauri migrates to GTK4.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # Transitive via wry -> proc-macro-error (build-time only, no runtime
    # exposure). Unmaintained, no safe upgrade in the wry version tauri pins.
    "RUSTSEC-2024-0370",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
# `multiple-versions = "warn"` rather than "deny": Tauri pins sha2/digest 0.10
# (plus their block-buffer/crypto-common/cpufeatures deps), and
# journal-crypto's object naming (spec §4.4) pulls the 0.11 line. Both line
# ranges are MIT OR Apache-2.0 and neither is ours to move — the 0.10 line is
# Tauri's upstream choice. Known, accepted drift, not something to "fix".
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
